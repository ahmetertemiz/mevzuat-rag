[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevzuat-rag"
version = "0.1.0"
description = "Türk e-ticaret ve tüketici mevzuatı üzerinde kaynak gösteren arama/RAG aracı"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
