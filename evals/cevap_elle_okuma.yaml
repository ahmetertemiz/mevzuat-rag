    liste_eksik:
      - id: A02
        aciklama: "TKHK m.15/1'deki dört seçimlik haktan üçü yazıldı (hizmetin yeniden görülmesi, bedelden indirim, sözleşmeden dönme); \"eserin ücretsiz onarımı\" atlandı. Alıntı tamdı, kısmi olduğu belirtilmedi."
      - id: A11
        aciklama: "Bağlı kredi tanımı (TKHK m.30/1) iki birlikte aranan koşuldan yalnız birini veriyor (münhasıran belirli mal/hizmetin finansmanı); \"iki sözleşmenin objektif açıdan ekonomik birlik oluşturması\" atlandı."
